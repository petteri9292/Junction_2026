[project]
name = "junction-2026"
version = "0.1.0"
description = "Junction 2026 ML and data analysis project"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb",
    "flask>=3.1.3",
    "huggingface-hub",
    "lm-format-enforcer>=0.11,<0.12",
    "matplotlib",
    "modal>=1.6.4",
    "model2vec>=0.9.0",
    "numpy",
    "pandas",
    "psutil>=7.2.2",
    "pyarrow",
    "pydantic>=2,<3",
    "pymysql>=1.2.4",
    "python-dotenv>=1.2.4",
    "requests",
    "scikit-learn",
    "scipy",
    "tensorboard",
    "tensorboardx",
    "transformers>=4.51,<5",
]

[dependency-groups]
fp8 = [
    "accelerate>=1,<2",
    "torch==2.6.0",
]
demo = [
    "gradio>=6,<7",
]
dev = ["ipykernel", "pytest", "ruff"]

[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["wikilens*"]

[tool.setuptools.package-data]
wikilens = ["schema.sql", "templates/*.html", "static/*.json", "recording_ui/*.html", "recording_ui/*.css", "recording_ui/*.js", "recording_ui/fixtures/*.json", "recording_ui/vendor/*"]

[tool.ruff]
target-version = "py312"
extend-exclude = ["_local_archive"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["_local_archive", ".venv", "data", "artifacts"]

